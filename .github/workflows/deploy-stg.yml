name: Deploy STG

# 何をする？
#   main ブランチに push されたら、stg flavor で Android APK をビルドする。
#   （実際の配信先：Firebase App Distribution などは後から追記する想定）

on:
  push:
    branches: [main]

jobs:
  build-stg-android:
    name: Build STG (Android)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Setup Java
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: "17"

      # サプライチェーン対策として、タグではなくコミットSHAで固定し、Flutter自体も
      # stable追従ではなく動作確認済みの具体バージョンに固定する。
      - name: Setup Flutter
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          flutter-version: "3.41.3"
          cache: true

      - name: Install dependencies
        run: flutter pub get

      # stg flavor でビルド
      - name: Build APK (stg)
        run: flutter build apk --flavor stg -t lib/main_stg.dart --release

      # 成果物を GitHub Actions のアーティファクトとして保存
      - name: Upload artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: app-stg-release
          path: build/app/outputs/flutter-apk/app-stg-release.apk
          retention-days: 14

      # ▼ 配信したいときはここを有効化（要：Firebase などの secrets 設定）
